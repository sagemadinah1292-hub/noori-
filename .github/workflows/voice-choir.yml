name: NOORI CHOIR Windows x64
on:
  push:
    branches: ['main']
    paths: ['voice-choir/**', 'activation-service/**', '.github/workflows/voice-choir.yml']
  pull_request:
    paths: ['voice-choir/**', 'activation-service/**', '.github/workflows/voice-choir.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: voice-choir-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  activation-php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-root-password
          MYSQL_DATABASE: noori_test
          MYSQL_USER: noori_ci
          MYSQL_PASSWORD: ci-only-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_sqlite, openssl
      - name: PHP syntax checks
        run: rg --files activation-service/php -g '*.php' -0 | xargs -0 -n1 php -l
      - name: Test PHP service with MySQL
        env:
          NOORI_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noori_test;charset=utf8mb4'
          NOORI_TEST_USER: noori_ci
          NOORI_TEST_PASSWORD: ci-only-test-password
        run: php activation-service/php/tests/service_test.php
      - name: Test owner portal and PHP API over HTTP fixture
        env:
          NOORI_TEST_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=noori_test;charset=utf8mb4'
          NOORI_TEST_USER: noori_ci
          NOORI_TEST_PASSWORD: ci-only-test-password
        run: python3 activation-service/php/tests/http_test.py
      - name: Test PHP service with isolated SQLite
        run: php activation-service/php/tests/service_test.php
      - name: Bundle Hostinger deployment files
        run: python3 activation-service/scripts/package-hostinger.py
      - uses: actions/upload-artifact@v4
        with:
          name: NOORI-Activation-Hostinger
          path: |
            dist-activation/NOORI-Activation-Hostinger.zip
            dist-activation/NOORI-Page-Only.zip
          if-no-files-found: error
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test activation service
        run: node activation-service/test/worker.test.mjs
      - name: Configure Windows x64
        shell: pwsh
        env:
          NOORI_PROTECTED_BUILD: ${{ vars.NOORI_ENABLE_LICENSING }}
          NOORI_ACTIVATION_URL: ${{ vars.NOORI_LICENSE_SERVER_URL }}
          NOORI_PUBLIC_MODULUS: ${{ vars.NOORI_LICENSE_PUBLIC_KEY_HEX }}
        run: |
          $licensing=if ($env:NOORI_PROTECTED_BUILD -eq 'ON') {'ON'} else {'OFF'}
          cmake -S voice-choir -B build-choir -G "Visual Studio 17 2022" -A x64 "-DNOORI_ENABLE_LICENSING=$licensing" "-DNOORI_LICENSE_SERVER_URL=$env:NOORI_ACTIVATION_URL" "-DNOORI_LICENSE_PUBLIC_KEY_HEX=$env:NOORI_PUBLIC_MODULUS"
          if ($LASTEXITCODE -ne 0) {throw 'Windows configuration failed'}
      - name: Compile VST3 and tests
        run: cmake --build build-choir --config Release --parallel 2
      - name: Test DSP, processor, editor and online activation
        shell: pwsh
        run: |
          $fixture=Join-Path (Get-Location) 'build-choir/license-fixture.json'
          $serverProcess=Start-Process node -ArgumentList 'activation-service/scripts/test-server.mjs', $fixture -RedirectStandardOutput 'build-choir/license-server.log' -RedirectStandardError 'build-choir/license-server.err' -PassThru
          try {
            $deadline=[DateTime]::UtcNow.AddSeconds(20)
            while (!(Test-Path $fixture)) {
              if ($serverProcess.HasExited) {throw 'Activation fixture process exited early'}
              if ([DateTime]::UtcNow -gt $deadline) {throw 'Activation test service did not start'}
              Start-Sleep -Milliseconds 100
            }
            $service=Get-Content $fixture -Raw | ConvertFrom-Json
            Invoke-RestMethod -Uri ($service.baseUrl + '/health') -TimeoutSec 5 | ConvertTo-Json
            ctest --test-dir build-choir -C Release --output-on-failure
            if ($LASTEXITCODE -ne 0) {throw 'Windows test suite failed'}
          } finally {
            Stop-Process -Id $serverProcess.Id -ErrorAction SilentlyContinue
            Get-Content 'build-choir/license-server.log' -ErrorAction SilentlyContinue
            Get-Content 'build-choir/license-server.err' -ErrorAction SilentlyContinue
          }
      - name: Verify and package
        shell: pwsh
        run: ./voice-choir/scripts/Package.ps1
      - name: Compile and test Windows installer
        shell: pwsh
        run: ./voice-choir/scripts/BuildInstaller.ps1
      - name: Upload installer and test evidence
        uses: actions/upload-artifact@v4
        with:
          name: NOORI-CHOIR-Setup-x64
          path: |
            dist-choir/NOORI_CHOIR_Setup_x64.exe
            dist-choir/INSTALLER-TEST-RESULTS.json
          if-no-files-found: error
      - name: Upload tested Windows x64 VST3 package
        uses: actions/upload-artifact@v4
        with:
          name: Noori-Choir-0.4.0-Windows-x64
          path: dist-choir/Noori-Choir-0.4.0-Windows-x64.zip
          if-no-files-found: error
      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: NOORI-CHOIR-UI-Previews
          path: build-choir/Preview*.png
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Voice-Choir-Test-Logs
          path: |
            build-choir/Testing/Temporary/
            build-choir/license-server.log
            build-choir/license-server.err
          if-no-files-found: ignore
